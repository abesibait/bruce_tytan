name: Build Bruce

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "PlatformIO environment"
        required: true
        default: Tytan
        type: choice
        options:
          - Tytan
          - smoochiee-board

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e ${{inputs.environment}} by @${{github.actor}}

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-firmware
          path: .pio/build/${{ inputs.environment }}/
